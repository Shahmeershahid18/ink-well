project_id = "ink-erp"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Single-operator system: accounts are created from the Supabase dashboard.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[realtime]
enabled = true
